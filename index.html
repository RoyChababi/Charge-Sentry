<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeSentry · Live demo</title>
<link rel="icon" href="data:,">
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --cs-white:#FFFFFF; --cs-ink:#1A1A1A; --cs-grey-600:#5B6670; --cs-grey-200:#E3E8ED;
  --cs-green:#2ECC71; --cs-amber:#F5A623; --cs-red:#E5484D; --cs-blue:#3B82F6;
  --green-ink:#17703D; --amber-ink:#8A5300; --red-ink:#B4232A; --blue-ink:#1D4ED8;
  --green-bg:#E7F8EE; --amber-bg:#FEF3DF; --red-bg:#FDECEC; --blue-bg:#EAF1FE; --grey-bg:#F3F5F7;
  --grey-400:#AEB7C0; --line:#E3E8ED;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E3E8ED;font-family:var(--font);color:var(--cs-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cs-blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-block;vertical-align:middle;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,#EEF1F4 0%,#E3E8ED 100%)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:linear-gradient(160deg,#EEF1F4 0%,#E3E8ED 100%)}

/* ---------- Top bar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;padding:0 24px;gap:16px;background:rgba(255,255,255,.72);border-bottom:1px solid #D8DEE4;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:600;background:var(--grey-bg);color:var(--cs-grey-600);border:1px solid var(--line);white-space:nowrap}
.chip-dark{background:var(--cs-ink);color:#fff;border-color:var(--cs-ink)}
.chip-proto{background:#FFF8E8;color:#7A4A00;border-color:#F3D9A4}
.tb-center{flex:1;display:flex;justify-content:center;align-items:baseline;gap:12px}
.tb-clock{font-size:24px;font-weight:700}
.tb-date{font-size:13px;color:var(--cs-grey-600)}
.tb-right{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cs-green);display:inline-block}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--cs-ink)}
.iconbtn:hover{background:var(--grey-bg)}
#soundHint{background:var(--blue-bg);color:var(--blue-ink);border-color:#C9DAFB;cursor:pointer}

/* ---------- Columns ---------- */
#cols{position:absolute;top:56px;bottom:40px;left:0;right:0;padding:16px 20px;display:grid;grid-template-columns:34fr 30fr 36fr;gap:16px}
.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:14px 18px 16px;min-height:0}
.col-label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cs-grey-600);display:flex;align-items:center;gap:8px;height:22px;margin-bottom:8px;flex:none}

/* ---------- Ticker ---------- */
#ticker{position:absolute;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:18px;padding:0 24px;background:#1C2126;color:#E9EDF1;font-size:13px;z-index:30;overflow:hidden}
.tk-label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#AEB7C0;flex:none}
#tkItems{display:flex;gap:28px;flex:1;min-width:0;overflow:hidden}
.tk-item{display:flex;align-items:center;gap:8px;white-space:nowrap;animation:tkIn .35s var(--ease)}
.tk-item:not(:first-child){opacity:.7}
.tk-time{color:#AEB7C0}
@keyframes tkIn{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Severity helpers ---------- */
.sev-dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.sv-info,.sv-timer{background:var(--cs-blue)} .sv-ok{background:var(--green-ink)} .sv-warning,.sv-ambient{background:#C77C00} .sv-alert{background:var(--cs-red)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap}
.t-grey{background:var(--grey-bg);color:var(--cs-grey-600)} .t-green{background:var(--green-bg);color:var(--green-ink)}
.t-amber{background:var(--amber-bg);color:var(--amber-ink)} .t-red{background:var(--red-bg);color:var(--red-ink)}
.t-blue{background:var(--blue-bg);color:var(--blue-ink)} .t-offline{background:#fff;color:var(--cs-grey-600);border:1px dashed var(--grey-400)}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}

/* =====================================================================
   MANAGER DASHBOARD
   ===================================================================== */
.mgr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none}
.mgr-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.mgr-sub{font-size:13px;color:var(--cs-grey-600);margin-top:2px}
.mgr-head .chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;flex:none}
.kpi{background:var(--grey-bg);border-radius:12px;padding:10px 12px}
.kpi-v{font-size:28px;font-weight:800;line-height:1.1}
.kpi-l{font-size:12px;color:var(--cs-grey-600);font-weight:600;line-height:1.25;margin-top:2px}
.kpi.bump{animation:bump .6s var(--ease)}
@keyframes bump{0%{background:var(--grey-bg)}30%{background:#DDF3E6}100%{background:var(--grey-bg)}}
.mgr-body{flex:1;display:grid;grid-template-columns:1fr 190px;gap:14px;min-height:0}
.mgr-left{display:flex;flex-direction:column;min-height:0}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cs-grey-600);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.ugrid-wrap{position:relative}
.ugrid{display:grid;grid-template-columns:16px repeat(8,1fr);gap:6px;align-items:center}
.floor{font-size:12px;font-weight:700;color:var(--cs-grey-600);text-align:center}
.utile{height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--grey-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--cs-grey-600);position:relative;padding:0;transition:background .25s,border-color .25s,color .25s}
.utile:hover{filter:brightness(.97)}
.utile .ic{width:14px;height:14px}
.utile.st-charging{background:var(--green-bg);border-color:var(--cs-green);color:var(--green-ink)}
.utile.st-warning,.utile.st-ambient{background:var(--amber-bg);border-color:var(--cs-amber);color:var(--amber-ink)}
.utile.st-alert{background:var(--cs-red);border-color:var(--red-ink);color:#fff}
.utile.st-timerStop,.utile.st-acknowledged{background:var(--blue-bg);border-color:var(--cs-blue);color:var(--blue-ink)}
.utile.st-offline{background:#fff;border:1.5px dashed var(--grey-400);color:var(--cs-grey-600)}
.utile.live::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--cs-ink);box-shadow:0 0 0 2px #fff}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px;font-size:12px;color:var(--cs-grey-600);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid}
.tooltip{position:absolute;z-index:5;pointer-events:none;background:#1C2126;color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:opacity .15s}
.tooltip.show{opacity:1}
.tooltip b{display:block;font-size:14px}
.spot{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;flex:none}
.spot-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spot-name{font-weight:800;font-size:15px}
.spot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.spot-v{font-size:22px;font-weight:800}
.spot-l{font-size:12px;color:var(--cs-grey-600);font-weight:600}
.feed{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);padding-left:12px}
.feed-list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.feed-item{display:flex;gap:8px;font-size:12.5px;line-height:1.3;animation:feedIn .35s var(--ease)}
.feed-item .sev-dot{width:16px;height:16px;margin-top:1px}
.feed-time{color:var(--cs-grey-600);font-size:12px}
.feed-item.sev-alert .feed-msg{color:var(--red-ink);font-weight:700}
@keyframes feedIn{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

.mbanner{position:absolute;left:12px;right:12px;top:12px;z-index:8;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:translateY(-140%);transition:transform .28s var(--ease)}
.mbanner.show{transform:none}
.mbanner.b-red{background:linear-gradient(90deg,#C9353B,#E5484D)}
.mbanner.b-green{background:var(--green-ink)}
.mbanner .grow{flex:1}
.mbanner button{height:34px;border-radius:9px;border:0;padding:0 14px;font-weight:700;background:#fff;color:var(--cs-ink)}
.mbanner .x{background:transparent;color:#fff;width:34px;padding:0}

.drawer{position:absolute;top:0;right:0;bottom:0;width:100%;background:#fff;z-index:7;transform:translateX(102%);transition:transform .3s var(--ease);display:flex;flex-direction:column;padding:16px 18px;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.drawer.open{transform:none}
.drawer.pushdown{padding-top:76px}
.dr-head{display:flex;align-items:center;gap:10px}
.dr-title{font-size:20px;font-weight:800;flex:1}
.dr-body{flex:1;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.dr-body::-webkit-scrollbar{display:none}
.dr-sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dr-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0}
.dr-row .k{color:var(--cs-grey-600)}
.dr-read{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dr-read .v{font-size:22px;font-weight:800}
.dr-read .l{font-size:12px;color:var(--cs-grey-600);font-weight:600}
.dr-ev{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--grey-bg)}
.dr-ev:last-child{border-bottom:0}
.dr-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;flex:none}
.mbtn{height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mbtn:hover{background:var(--grey-bg)}
.mbtn.primary{background:var(--cs-red);border-color:var(--cs-red);color:#fff}
.mbtn.primary:hover{background:#D63B40}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
.safe-chip{display:flex;align-items:center;gap:8px;background:var(--green-bg);color:var(--green-ink);font-weight:800;border-radius:12px;padding:10px 12px;font-size:15px}
.mmodal{position:absolute;inset:0;z-index:9;background:rgba(20,24,28,.45);display:none;align-items:center;justify-content:center}
.mmodal.show{display:flex}
.mmodal .box{background:#fff;border-radius:16px;padding:22px;width:340px;text-align:center;box-shadow:var(--shadow)}

/* =====================================================================
   PHONE FRAME
   ===================================================================== */
.phone-col{align-items:center}
.phone-col .col-label{align-self:stretch}
.phone-holder{position:relative;width:386px;height:808px;flex:none}
.phone-holder.shake{animation:shake .55s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}12%{transform:translateX(-11px)}26%{transform:translateX(10px)}40%{transform:translateX(-8px)}55%{transform:translateX(6px)}70%{transform:translateX(-4px)}85%{transform:translateX(2px)}}
.phone{position:absolute;top:0;left:50%;margin-left:-207px;width:414px;height:868px;border-radius:60px;background:#15181B;padding:12px;transform:scale(.93);transform-origin:top center;box-shadow:0 0 0 2px #2A2F34 inset,0 24px 50px rgba(15,20,25,.28),0 4px 10px rgba(15,20,25,.2)}
.screen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:20px;background:#000;z-index:80}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-size:16px;font-weight:700;z-index:65;background:rgba(255,255,255,.92)}
.statusbar.dark{background:transparent;color:#fff}
.sb-icons{display:flex;align-items:center;gap:6px}
.homebar{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#111;z-index:85;pointer-events:none}
.homebar.light{background:#fff}
.pview{position:absolute;top:54px;bottom:84px;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:6px 16px 24px;scrollbar-width:none;user-select:none;-webkit-user-select:none}
.pview::-webkit-scrollbar{display:none}
.pview.dragging{cursor:grabbing}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:1px solid var(--line);background:rgba(255,255,255,.96);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 24px;z-index:20}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--cs-grey-600);position:relative;border-radius:10px}
.tab.on{color:var(--cs-ink)}
.tab.on .ic{color:var(--cs-ink)}
.badge{position:absolute;top:2px;left:50%;margin-left:6px;min-width:18px;height:18px;border-radius:9px;background:var(--cs-red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* phone content */
.p-top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.p-greet{font-size:22px;font-weight:800;letter-spacing:-.01em}
.p-sub{font-size:13px;color:var(--cs-grey-600);margin-top:2px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--cs-ink);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.p-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}
.p-back{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.p-back button{border:0;background:transparent;display:inline-flex;align-items:center;gap:2px;font-size:16px;font-weight:600;color:var(--blue-ink);padding:6px 4px 6px 0}
.p-back h2{font-size:18px;margin:0;flex:1;text-align:center;padding-right:56px}
.hero{border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;border:1.5px solid;transition:background .3s,border-color .3s;cursor:default;width:100%;text-align:left;font:inherit}
.hero.h-idle{background:var(--grey-bg);border-color:var(--line)}
.hero.h-charging{background:var(--green-bg);border-color:#9FE3BC}
.hero.h-warning,.hero.h-ambient{background:var(--amber-bg);border-color:#F6CF8A}
.hero.h-alert{background:var(--red-bg);border-color:var(--cs-red);cursor:pointer}
.hero.h-timerStop,.hero.h-acknowledged{background:var(--blue-bg);border-color:#B9CFFB}
.hero-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.h-idle .hero-ic{background:var(--cs-grey-600)} .h-charging .hero-ic{background:var(--green-ink)}
.h-warning .hero-ic,.h-ambient .hero-ic{background:#C77C00} .h-alert .hero-ic{background:var(--cs-red)}
.h-timerStop .hero-ic,.h-acknowledged .hero-ic{background:var(--blue-ink)}
.hero-txt{flex:1;min-width:0}
.hero-state{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.h-idle .hero-state{color:var(--cs-grey-600)} .h-charging .hero-state{color:var(--green-ink)}
.h-warning .hero-state,.h-ambient .hero-state{color:var(--amber-ink)} .h-alert .hero-state{color:var(--red-ink)}
.h-timerStop .hero-state,.h-acknowledged .hero-state{color:var(--blue-ink)}
.hero-title{font-size:19px;font-weight:800;line-height:1.2;margin-top:2px}
.hero-s{font-size:13px;color:#3E4850;margin-top:4px;line-height:1.35}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-v b{font-size:28px;font-weight:800}
.ring-v > span{font-size:11px;color:var(--cs-grey-600);font-weight:700;margin-top:2px}
.ring .arc{transition:stroke-dashoffset .6s linear,stroke .3s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:10px 10px 6px;background:#fff;transition:background .3s,border-color .3s}
.tile-l{font-size:12px;font-weight:700;color:var(--cs-grey-600);display:flex;align-items:center;gap:4px}
.tile-v{font-size:28px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.tile-v small{font-size:13px;font-weight:700;color:var(--cs-grey-600);margin-left:2px;letter-spacing:0}
.tile.tone-amber{background:var(--amber-bg);border-color:#F6CF8A}
.tile.tone-red{background:var(--red-bg);border-color:var(--cs-red)}
.tile.tone-red .tile-v{color:var(--red-ink)} .tile.tone-amber .tile-v{color:var(--amber-ink)}
.spark{width:100%;height:28px;display:block;margin-top:4px}
.spark polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pcard{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.srow .k{font-size:12px;color:var(--cs-grey-600);font-weight:600}
.srow .v{font-size:15px;font-weight:800;margin-top:2px}
.btn{width:100%;height:52px;border-radius:15px;border:0;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;transition:transform .1s,background .2s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--cs-ink);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--red-ink);color:var(--red-ink)}
.btn-red{background:var(--cs-red);color:#fff}
.btn-light{background:var(--grey-bg);color:var(--cs-ink)}
.btn-blue{background:var(--blue-ink);color:#fff}
.h-sec{font-size:13px;font-weight:800;color:var(--cs-grey-600);letter-spacing:.06em;text-transform:uppercase;margin:18px 2px 8px}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dev{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.dev:hover{background:var(--grey-bg)}
.dev-top{display:flex;justify-content:space-between;align-items:center;color:var(--cs-grey-600)}
.dev-meta{font-size:12px;color:var(--cs-grey-600);font-weight:600;display:flex;align-items:center;gap:5px}
.online{width:8px;height:8px;border-radius:50%;background:var(--cs-green);display:inline-block}
.list{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;width:100%;border-left:0;border-right:0;border-top:0;text-align:left;font-size:15px}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--grey-bg)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .d{font-size:13px;color:var(--cs-grey-600);margin-top:2px;line-height:1.3}
.li.unread .t{font-weight:800}
.li .when{font-size:12px;color:var(--cs-grey-600);white-space:nowrap}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--cs-blue);flex:none}
.li-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.switch{width:51px;height:31px;border-radius:16px;border:0;background:#D1D7DD;position:relative;flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--green-ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch:disabled{opacity:.6;cursor:not-allowed}
.range{width:100%;accent-color:var(--cs-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--grey-bg);border-radius:11px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:transparent;height:32px;border-radius:9px;font-weight:700;font-size:14px;color:var(--cs-grey-600)}
.seg button.on{background:#fff;color:var(--cs-ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rchip{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--cs-grey-600)}
.kv .v{font-weight:700;text-align:right}
.big-ill{display:flex;justify-content:center;margin:20px 0 10px}
.note{font-size:12px;color:var(--cs-grey-600);text-align:center;margin-top:14px;line-height:1.4}
.trend-card{background:var(--amber-bg);border:1px solid #F6CF8A;border-radius:16px;padding:14px;margin-top:12px}
.trend-card b{color:var(--amber-ink)}

/* splash, notification, overlays */
.splash{position:absolute;inset:0;background:#fff;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease-out;cursor:pointer}
.splash.hide{opacity:0;pointer-events:none}
.splash .wm{font-size:30px;font-weight:800;letter-spacing:-.02em}
.notif{position:absolute;top:52px;left:10px;right:10px;z-index:70;background:rgba(250,251,252,.97);border-radius:20px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.22);transform:translateY(-220px);opacity:0;pointer-events:none;transition:transform .32s var(--ease),opacity .2s;display:flex;gap:10px;cursor:pointer;border:1px solid var(--line);text-align:left;width:calc(100% - 20px);font:inherit}
.notif.show{transform:none;opacity:1;pointer-events:auto}
.notif .n-app{font-size:12px;font-weight:700;color:var(--cs-grey-600);display:flex;justify-content:space-between;letter-spacing:.04em;text-transform:uppercase}
.notif .n-t{font-size:15px;font-weight:800;margin-top:2px}
.notif .n-b{font-size:13px;color:#3E4850;margin-top:2px;line-height:1.3}
.notif .grow{flex:1;min-width:0}
.overlay{position:absolute;inset:0;z-index:50;display:none}
.overlay.show{display:block}
.alert-scr{position:absolute;inset:0;background:linear-gradient(180deg,#E5484D 0%,#C9353B 60%);color:#fff;padding:64px 20px 30px;overflow-y:auto;scrollbar-width:none;animation:slideUp .3s var(--ease)}
.alert-scr::-webkit-scrollbar{display:none}
.alert-scr.ack{background:linear-gradient(180deg,#1E7A45 0%,#17703D 60%)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.as-icon{width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin:6px auto 12px}
.as-title{font-size:28px;font-weight:800;text-align:center;line-height:1.15}
.as-sub{font-size:15px;text-align:center;margin-top:8px;line-height:1.4;color:#FFF5F5}
.tl{margin:18px 0 6px;background:rgba(0,0,0,.16);border-radius:16px;padding:12px 14px}
.tl-i{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;line-height:1.3}
.tl-i .tt{font-size:12px;opacity:.9;width:62px;flex:none;padding-top:1px}
.tl-i .tdot{width:18px;height:18px;border-radius:50%;background:#fff;color:#C9353B;display:flex;align-items:center;justify-content:center;flex:none}
.tl-i.off{opacity:.65}
.tl-i.off .tdot{background:rgba(255,255,255,.35);color:#fff}
.as-btns{display:grid;gap:10px;margin-top:14px}
.as-btn{height:54px;border-radius:15px;border:0;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.as-btn.white{background:#fff;color:var(--red-ink)}
.as-btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.as-btn.sim-tap{animation:simtap .45s ease-out}
@keyframes simtap{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.8)}40%{transform:scale(.95)}100%{transform:scale(1);box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.guide{font-size:14px;line-height:1.45;background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;margin-top:14px}
.sheet-wrap{position:absolute;inset:0;z-index:60;background:rgba(10,12,14,.42);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:16px 20px 40px;animation:slideUp .28s var(--ease);max-height:88%;overflow:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D1D7DD;margin:0 auto 14px}
.call{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#2B3138,#111417);color:#fff;display:flex;flex-direction:column;align-items:center;padding:110px 24px 60px;animation:fade .2s}
.call .who{font-size:30px;font-weight:700;margin-top:18px}
.call .st{font-size:16px;opacity:.85;margin-top:6px}
.call .simnote{margin-top:auto;font-size:13px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;text-align:center}
.endcall{width:72px;height:72px;border-radius:50%;background:var(--cs-red);border:0;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:22px}
.search{position:relative;width:150px;height:150px;margin:16px auto}
.search i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--cs-blue);animation:ringOut 1.8s ease-out infinite}
.search i:nth-child(2){animation-delay:.6s} .search i:nth-child(3){animation-delay:1.2s}
.search .core{position:absolute;inset:45px;border-radius:50%;background:var(--cs-ink);color:#fff;display:flex;align-items:center;justify-content:center}
@keyframes ringOut{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.steps span{width:28px;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--cs-ink)}
.succ{width:90px;height:90px;border-radius:50%;background:var(--green-ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:20px auto 10px;animation:pop .4s var(--ease)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.caption{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);background:rgba(20,24,28,.92);color:#fff;font-size:17px;font-weight:700;padding:10px 18px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s var(--ease);z-index:10;pointer-events:none;max-width:96%}
.caption.show{opacity:1;transform:translate(-50%,0)}

/* =====================================================================
   DEVICE DIAGRAM
   ===================================================================== */
#diagSvg{width:100%;height:auto;display:block}
#diagSvg text{font-family:var(--font)}
.cable{fill:none;stroke:#2B3138;stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.dead .cable,.cable.dead{stroke:#C3CAD1}
.flow{fill:none;stroke:var(--cs-green);stroke-width:3;stroke-dasharray:7 9;stroke-linecap:round;opacity:0;transition:opacity .3s;animation:flow .8s linear infinite}
.flow.on{opacity:1}
@keyframes flow{to{stroke-dashoffset:-32}}
.wisp{fill:none;stroke-width:3;stroke-linecap:round;animation:wisp 2.8s ease-in infinite;opacity:0}
@keyframes wisp{0%{transform:translateY(0);opacity:0}25%{opacity:.85}100%{transform:translateY(-48px);opacity:0}}
.led{transition:fill .3s}
.cutbadge{opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.cutbadge.show{opacity:1}
.charts{display:grid;gap:14px;margin-top:10px}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--cs-grey-600);margin-bottom:4px}
.chart-h b{font-size:18px;color:var(--cs-ink)}
.chart canvas{width:100%;height:150px;display:block;border-radius:10px;background:#FAFBFC;border:1px solid var(--line)}
.diag-status{display:flex;align-items:center;gap:10px;margin-top:10px;flex:none}
.diag-status .txt{font-size:13px;color:var(--cs-grey-600)}

/* =====================================================================
   PRESENTER PANEL
   ===================================================================== */
#presenter{position:absolute;top:56px;right:0;bottom:40px;width:320px;background:rgba(17,20,24,.97);backdrop-filter:blur(6px);color:#EEF1F4;z-index:40;transform:translateX(102%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s linear .28s;padding:16px;overflow-y:auto;scrollbar-width:none;font-size:13px;box-shadow:-12px 0 30px rgba(0,0,0,.25)}
#presenter::-webkit-scrollbar{display:none}
#presenter.open{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.pp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pp-h b{font-size:16px}
.pp-sec{border-top:1px solid rgba(255,255,255,.12);padding-top:10px;margin-top:10px}
.pp-t{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#AEB7C0;font-weight:700;margin-bottom:8px}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pp-btn{display:flex;align-items:center;gap:8px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:13px;font-weight:600;padding:0 8px;text-align:left}
.pp-btn:hover{background:rgba(255,255,255,.14)}
.pp-btn.hot{border-color:#E5484D;background:rgba(229,72,77,.22)}
.pp-btn.wide{grid-column:1/-1;justify-content:center}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:rgba(255,255,255,.16);border-radius:5px;padding:2px 6px;min-width:20px;text-align:center;color:#fff}
.pp-read{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pp-read div{background:rgba(255,255,255,.06);border-radius:8px;padding:6px 8px}
.pp-read .l{font-size:11px;color:#AEB7C0}
.pp-read .v{font-size:15px;font-weight:700}
.pp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
.pp-state{font-size:15px;font-weight:800}
.pp-next{background:rgba(255,255,255,.06);border-radius:8px;padding:8px;line-height:1.4}
.pp-x{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff}
.pp-x:hover{background:rgba(255,255,255,.1)}

@media (prefers-reduced-motion: reduce){
  .pulse,.phone-holder.shake,.wisp,.search i,.flow,.as-btn.sim-tap,.kpi.bump{animation:none !important}
  .wisp{opacity:.6}
}

function demoStart() { const d = new Date(); d.setHours(CONFIG.startHour, CONFIG.startMin, 0, 0); return d.getTime(); }

function buildSeed(r, startMs) {
  const DAY = 86400000;
  // ---- 14 nights of charge history for unit 304 (newest first)
  const sessions = [];
  for (let i = 1; i <= 14; i++) {
    const d = new Date(startMs - i * DAY); d.setHours(21 + Math.floor(r() * 2), Math.floor(r() * 60), 0, 0);
    let durH = 1.5 + r() * 1.5;
    const age = (i - 1) / 13;
    let maxT = 34.0 - age * 1.9 + (r() - 0.5) * 0.5;
    if (i === 1) maxT = 34.0;
    let result = 'normal';
    if (i === 9) { result = 'timer'; durH = 6; }
    if (i === 4 || i === 11) result = 'ambient';
    sessions.push({ start: d.getTime(), durH: +durH.toFixed(2), maxT: +maxT.toFixed(1), result });
  }
  // ---- 6-week heat trend (weekly peak), slow upward drift
  const trendVals = [30.0, 30.8, 31.5, 32.3, 33.1, 34.0];
  const trend = trendVals.map((v, i) => ({ week: startMs - (5 - i) * 7 * DAY, v }));
  // ---- tenant alert history (3 items, all resolved)
  const tenantAlerts = [];
  sessions.forEach(s => {
    if (s.result === 'timer') tenantAlerts.push({ id: 'h' + s.start, time: s.start + 6 * 3600000, type: 'timer', sev: 'timer', title: 'Charge stopped by timer', detail: 'Stopped at your 6 h limit. Battery was full.', read: true, resolved: true });
    if (s.result === 'ambient') tenantAlerts.push({ id: 'h' + s.start, time: s.start + 1800000, type: 'ambient', sev: 'ambient', title: 'Room vapour detected, no action', detail: 'Pod and room air rose together, likely cooking. Charging continued.', read: true, resolved: true });
  });
  tenantAlerts.sort((a, b) => b.time - a.time);
  // ---- building units
  const units = {}; const L = 'ABCDEFGHJKLMNPRSTVWY';
  const eligible = [];
  for (let f = 1; f <= 5; f++) for (let n = 1; n <= 8; n++) {
    const id = f * 100 + n;
    const ini = id === 304 ? 'M.L.' : L[Math.floor(r() * L.length)] + '.' + L[Math.floor(r() * L.length)] + '.';
    const u = { id, floor: f, initials: ini, state: 'idle', temp: +(21.5 + r() * 1.6).toFixed(1), pct: Math.round(20 + r() * 60), power: 0, voc: Math.round(42 + r() * 14) };
    if (id === 207 || id === 415) u.state = 'offline';
    else if (id !== 304) eligible.push(id);
    units[id] = u;
  }
  for (let k = 0; k < 8; k++) {
    const idx = Math.floor(r() * eligible.length); const id = eligible.splice(idx, 1)[0];
    const u = units[id]; u.state = 'charging'; u.temp = +(27 + r() * 5).toFixed(1); u.power = Math.round(120 + r() * 24);
  }
  // ---- seeded per-unit events
  const unitEvents = {}; const kinds = [['Charge complete', 'ok'], ['Charging started', 'info'], ['Charge stopped by timer', 'timer'], ['Ambient vapour filtered, no cut', 'ambient']];
  Object.values(units).forEach(u => {
    const list = []; const cnt = 2 + Math.floor(r() * 3);
    for (let k = 0; k < cnt; k++) { const kk = kinds[Math.floor(r() * (k === 0 ? 2 : kinds.length))]; list.push({ time: startMs - Math.floor((k + 0.3 + r()) * DAY * 1.3), message: kk[0], severity: kk[1], readings: { temp: +(28 + r() * 5).toFixed(1), pod: Math.round(45 + r() * 15), room: Math.round(40 + r() * 15), power: Math.round(r() * 140), relay: 'on' } }); }
    if (u.state === 'offline') list.unshift({ time: startMs - (u.id === 207 ? 6600000 : 3000000), message: 'Device offline (Wi-Fi lost)', severity: 'info', readings: null });
    unitEvents[u.id] = list.sort((a, b) => b.time - a.time);
  });
  // ---- manager feed seed
  const m = 60000;
  const feed = [
    { time: startMs - 6 * m, unit: 112, severity: 'ok', message: 'Unit 112 · Charge complete' },
    { time: startMs - 19 * m, unit: 503, severity: 'ambient', message: 'Unit 503 · Ambient vapour filtered, no cut' },
    { time: startMs - 32 * m, unit: 216, severity: 'timer', message: 'Unit 216 · Charge stopped by timer' },
    { time: startMs - 50 * m, unit: 415, severity: 'info', message: 'Unit 415 · Device offline' },
    { time: startMs - 110 * m, unit: 207, severity: 'info', message: 'Unit 207 · Device offline' },
    { time: startMs - 140 * m, unit: 308, severity: 'ok', message: 'Unit 308 · Charge complete' }
  ];
  return { sessions, trend, tenantAlerts, units, unitEvents, feed };
}

/* =====================================================================

   ===================================================================== */
const Bus = {
  subs: {},
  on(ch, fn) { (this.subs[ch] || (this.subs[ch] = [])).push(fn); },
  emit(ch, p) { (this.subs[ch] || []).forEach(fn => { try { fn(p); } catch (e) { logError(e); } }); }
};
function readings() { const u = S.u; return { temp: +u.batteryTempC.toFixed(1), pod: Math.round(u.podVoc), room: Math.round(u.roomVoc), power: Math.round(u.powerW), relay: u.relay }; }
function emit(ev) {
  const e = Object.assign({ id: ++S.seq, time: S.simMs, unit: 304, severity: 'info', readings: readings(), notify: false, action: '' }, ev);
  S.log.push(e);
  Bus.emit('event', e);
  return e;
}

/* =====================================================================
   SIMULATION ENGINE
   ===================================================================== */
function expectedPower(pct) {
  if (pct < CONFIG.taperStart) return CONFIG.powerNominal;
  return CONFIG.powerNominal - (CONFIG.powerNominal - CONFIG.powerMin) * clamp((pct - CONFIG.taperStart) / (100 - CONFIG.taperStart), 0, 1);
}
function isLive() { const u = S.u; return u.relay === 'on' && u.charging && !u.testCut; }
const nz = r => (RNG.sim() * 2 - 1) * r;

function step() {
  const u = S.u, B = CONFIG.base;
  const sc = S.scenario;
  if (sc) sc.t += 1;
  const live = isLive();
  // battery + power
  if (live) u.batteryPct = Math.min(100, u.batteryPct + CONFIG.chargeRate);
  const exp = live ? expectedPower(u.batteryPct) : 0;
  let p = live ? exp + nz(1.5) : 0;
  if (live && sc && sc.type === 'fault') p = CONFIG.faultPowerW + nz(3);
  u.powerW = Math.max(0, p);
  u.voltage = 120 + nz(0.6);
  // temperature
  const load = Math.min(u.powerW / CONFIG.powerNominal, 1.6);
  if (sc && sc.type === 'heat') {
    u.batteryTempC = sc.t <= sc.ramp ? sc.t0 + (sc.peak - sc.t0) * sc.t / sc.ramp + nz(0.1) : sc.peak + nz(0.15);
    if (sc.t >= sc.ramp + sc.hold) S.scenario = null;
  } else {
    let tT = B.temp + CONFIG.tempLoadGain * load;
    if (sc && sc.type === 'offgas') tT += 6 * clamp(sc.t / sc.ramp, 0, 1);
    u.batteryTempC += (tT - u.batteryTempC) * CONFIG.tempK + nz(0.15);
  }
  // VOC
  const slow = u.slowDecay > 0; if (slow) u.slowDecay--;
  const podK = slow ? CONFIG.vocSlowK : CONFIG.podK, roomK = slow ? CONFIG.vocSlowK : CONFIG.roomK;
  if (sc && sc.type === 'cooking') {
    const rr = sc.rise * 0.8;
    u.roomVoc = sc.t < rr ? sc.r0 + (sc.roomPeak - sc.r0) * sc.t / rr + nz(3) : sc.roomPeak + nz(5);
    u.podVoc = sc.t < sc.rise ? sc.p0 + (sc.podPeak - sc.p0) * sc.t / sc.rise + nz(3) : sc.podPeak + nz(5);
    if (sc.t >= sc.rise + sc.hold) S.scenario = null;
  } else if (sc && sc.type === 'offgas') {
    u.podVoc = sc.t < sc.ramp ? sc.p0 + (sc.peak - sc.p0) * sc.t / sc.ramp + nz(3) : sc.peak + nz(4);
    u.roomVoc += (B.roomVoc - u.roomVoc) * roomK + nz(3);
  } else {
    u.podVoc += (B.podVoc - u.podVoc) * podK + nz(4);
    u.roomVoc += (B.roomVoc - u.roomVoc) * roomK + nz(4);
  }
  u.podVoc = clamp(u.podVoc, 0, 500); u.roomVoc = clamp(u.roomVoc, 0, 500);
  S.hist.push({ temp: u.batteryTempC, pod: u.podVoc, room: u.roomVoc, power: u.powerW });
  if (S.hist.length > CONFIG.histLen) S.hist.shift();
  if (live && u.batteryPct >= 100) chargeComplete();
  detect();
  updateSystemState();
}

function detect() {
  const u = S.u, C = CONFIG;
  if (u.alert || u.acknowledged) { u.cnt.heat = u.cnt.voc = u.cnt.cur = 0; return; }
  const live = isLive();
  if (u.podVoc > C.vocRise) { if (!u.vocRiseAt) u.vocRiseAt = S.simMs; } else if (u.podVoc < C.vocRise - 25) u.vocRiseAt = null;
  if (u.batteryTempC > C.heatWarnC) { if (!u.heatRiseAt) u.heatRiseAt = S.simMs; } else u.heatRiseAt = null;
  u.cnt.heat = u.batteryTempC > C.heatWarnC ? u.cnt.heat + 1 : 0;
  u.cnt.voc = (u.podVoc > C.vocAlert && u.roomVoc < C.roomNormalMax) ? u.cnt.voc + 1 : 0;
  u.cnt.cur = (live && u.powerW > C.currentFactor * expectedPower(u.batteryPct)) ? u.cnt.cur + 1 : 0;
  if (u.batteryTempC > C.criticalC) return triggerAlert('heat');
  if (u.cnt.voc >= C.vocAlertHoldS) return triggerAlert('offgas');
  if (u.cnt.cur >= C.currentHoldS) return triggerAlert('electrical');
  if (live && u.sessionStart != null && (S.simMs - u.sessionStart) >= u.timerLimitH * 3600000) return timerStop();
  // ambient filter: pod and room air rise together
  const amb = u.podVoc > C.vocAlert && u.roomVoc > C.roomAmbientMin;
  if (amb && !u.ambientActive) {
    u.ambientActive = true; S.kpi.ambientFiltered++;
    updateSystemState();
    emit({ type: 'ambient', severity: 'ambient', title: 'Room vapour detected', message: 'Unit 304 · Room vapour detected, likely cooking. Monitoring, no cut.', notify: true, action: 'No action (ambient filter)' });
  } else if (u.ambientActive && u.podVoc < C.vocClear) {
    u.ambientActive = false; updateSystemState();
    emit({ type: 'normal', severity: 'ok', message: 'Unit 304 · Room air back to normal. Charging continues.' });
  }
  if (u.cnt.heat >= C.heatWarnHoldS && !u.warningActive) {
    u.warningActive = true; updateSystemState();
    emit({ type: 'warning', severity: 'warning', title: 'Battery running warm', message: `Unit 304 · Battery running warm (${u.batteryTempC.toFixed(1)} °C)`, notify: true, action: 'Monitoring closely' });
  } else if (u.warningActive && u.batteryTempC < C.heatClearC) {
    u.warningActive = false; updateSystemState();
    emit({ type: 'normal', severity: 'ok', message: 'Unit 304 · Battery temperature back to normal' });
  }
}

function deriveState() {
  const u = S.u;
  if (u.alert) return 'alert';
  if (u.acknowledged) return 'acknowledged';
  if (u.timerStopped) return 'timerStop';
  if (u.ambientActive) return 'ambient';
  if (u.warningActive) return 'warning';
  if (u.charging && (u.relay === 'on' || u.testCut)) return 'charging';
  return 'idle';
}
function updateSystemState() {
  const n = deriveState(), o = S.u.systemState;
  if (n !== o) { S.u.systemState = n; Bus.emit('state', { from: o, to: n }); }
}

function triggerAlert(kind) {
  const u = S.u, t0 = S.simMs;
  const snap = readings();
  const rising = kind === 'offgas' ? (u.vocRiseAt || t0 - 6000) : kind === 'heat' ? (u.heatRiseAt || t0 - 5000) : t0 - CONFIG.currentHoldS * 1000;
  u.relay = 'cut'; u.charging = false; u.testCut = false;
  u.alert = { kind, t0, risingAt: rising, readings: snap, monitoring: S.settings.monitoring, ack: null };
  u.sessionStart = null; u.warningActive = false; u.ambientActive = false; u.timerStopped = false;
  u.cnt = { heat: 0, voc: 0, cur: 0 }; S.scenario = null; u.slowDecay = CONFIG.slowDecayS; u.powerW = 0;
  S.kpi.alertsMonth++;
  updateSystemState();
  const A = STRINGS.alerts[kind];
  emit({ type: 'alert', kind, severity: 'alert', title: A.title, message: A.ticker, notify: true, action: 'Relay cut in 0.8 s', readings: snap });
  emit({ type: 'cut', severity: 'alert', time: t0 + 800, message: 'Unit 304 · Smart Plug cut power (0.8 s)', action: 'Relay cut', readings: snap });
  emit({ type: 'notify_mgr', severity: 'info', time: t0 + 1000, message: 'Unit 304 · Tenant and building manager notified', action: 'Dual alert sent', readings: snap });
  if (S.settings.monitoring) emit({ type: 'monitoring', severity: 'info', time: t0 + 1000, message: 'Unit 304 · Alarm monitoring centre notified', action: 'Monitoring notified', readings: snap });
}

function startCharge() {
  const u = S.u;
  if (u.alert) acknowledge('tenant', true);
  u.acknowledged = false; u.timerStopped = false; u.timerInfo = null;
  if (u.batteryPct >= 99.5) u.batteryPct = CONFIG.startPct;
  u.relay = 'on'; u.charging = true; u.testCut = false; u.sessionStart = S.simMs; u.cnt = { heat: 0, voc: 0, cur: 0 };
  updateSystemState();
  emit({ type: 'charge_start', severity: 'ok', message: 'Unit 304 · Charging started', action: 'Relay on' });
}
function stopCharge() {

/* ---------- Building background simulation ---------- */
function buildingTick() {
  if (S.tick % 16 === 0) {
    Object.values(S.units).forEach(b => {
      if (b.id === 304 || b.state !== 'charging') return;
      b.temp = +clamp(b.temp + (RNG.bld() - 0.5) * 0.6, 26, 33).toFixed(1);
      b.power = Math.round(clamp(b.power + (RNG.bld() - 0.5) * 6, 110, 146));
      b.voc = Math.round(clamp(b.voc + (RNG.bld() - 0.5) * 6, 38, 62));
      b.pct = Math.min(99, b.pct + 1);
    });
  }
  if (S.tick % 48 === 24) {
    const others = Object.values(S.units).filter(b => b.id !== 304 && b.state !== 'offline');
    const ch = others.filter(b => b.state === 'charging'), idle = others.filter(b => b.state === 'idle');
    let start = RNG.bld() < 0.5;
    if (ch.length <= 6) start = true; if (ch.length >= 10) start = false;
    const pool = start ? idle : ch; const b = pool[Math.floor(RNG.bld() * pool.length)];
    if (b) {
      if (start) { b.state = 'charging'; b.temp = 24.5; b.power = 138; addFeed({ time: S.simMs, unit: b.id, severity: 'info', message: `Unit ${b.id} · Charging started` }); }
      else { b.state = 'idle'; b.power = 0; b.temp = 23.5; addFeed({ time: S.simMs, unit: b.id, severity: 'ok', message: `Unit ${b.id} · Charge complete` }); }
      S.unitEvents[b.id].unshift({ time: S.simMs, message: start ? 'Charging started' : 'Charge complete', severity: start ? 'info' : 'ok', readings: { temp: b.temp, pod: b.voc, room: 44, power: b.power, relay: start ? 'on' : 'off' } });
      renderGrid(); renderKpis();
    }
  }
}

/* ---------- Main loop ---------- */
function tick() {
  try {
    if (!S.paused) {
      scriptTick();
      S.tick++;
      S.accum += CONFIG.tickMs / 1000 * speed();
      let n = 0;
      while (S.accum >= 1 && n < 200) { S.accum -= 1; S.simMs += 1000; step(); n++; }
      buildingTick();
    }
    renderLive();
  } catch (e) { logError(e); }
}

const Sound = {
  ctx: null, unlocked: false,
  unlock() {
    if (this.unlocked) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      this.unlocked = true; renderSoundChip();
    } catch (e) { logError(e); }
  },
  tone(freq, dur, at, vol = 0.18, type = 'sine') {
    const c = this.ctx; const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, t + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  play(kind) {
    if (!UI.soundOn || !this.unlocked || !this.ctx) return;
    try {
      if (kind === 'info') this.tone(880, 0.12, 0, 0.14);
      else if (kind === 'warning') { this.tone(660, 0.16, 0, 0.16); this.tone(880, 0.16, 0.2, 0.16); }
      else if (kind === 'alert') { for (let r = 0; r < 2; r++) for (let i = 0; i < 3; i++) this.tone(1000, 0.15, r * 1.0 + i * 0.25, 0.2, 'square'); }
    } catch (e) { logError(e); }
  }
};

  const el = $('#soundHint');
  if (!Sound.unlocked) { el.innerHTML = icon('sound', 15) + 'Click to enable sound'; el.style.display = ''; el.setAttribute('aria-label', 'Click to enable sound'); }

/* ---------- Live values (shared by all views) ---------- */
function relayLabel() { const u = S.u; return u.relay === 'on' ? 'ON' : u.relay === 'cut' ? 'CUT' : 'OFF'; }
function liveValues() {
  const u = S.u, now = S.simMs;
  const el = u.sessionStart != null ? (now - u.sessionStart) / 1000 : 0;
  const est = isLive() ? now + (100 - u.batteryPct) / CONFIG.chargeRate * 1000 : null;
  const eh = Math.floor(el / 3600), em = Math.floor(el % 3600 / 60);
  return {
    clock: fmtHM(now), clockS: fmtHMS(now),
    temp: u.batteryTempC.toFixed(1), voc: String(Math.round(u.podVoc)), room: String(Math.round(u.roomVoc)),
    power: String(Math.round(u.powerW)), amps: (u.powerW / u.voltage).toFixed(2), volt: u.voltage.toFixed(1), pct: String(Math.floor(u.batteryPct)),
    relay: relayLabel(), relayFull: u.testCut ? 'CUT (test)' : u.relay === 'on' ? 'ON · power flowing' : u.relay === 'cut' ? 'CUT · power off' : 'OFF · standby',
    started: u.sessionStart != null ? fmtHM(u.sessionStart) : '—', elapsed: u.sessionStart != null ? fmtDur(el) : '—',
    elapsedShort: u.sessionStart != null ? `${eh}:${pad2(em)}` : '—',
    estFull: est ? fmtHM(est) : '—', timer: u.timerLimitH + ' h',
    stateLabel: STRINGS.states[u.systemState].title
  };
}
function applyLive(root, vals) {
  $$('[data-live]', root).forEach(el => { const k = el.getAttribute('data-live'); if (k in vals) setText(el, vals[k]); });
}
function sparkPoints(key, n, minSpan) {
  const h = S.hist.slice(-n); const vals = h.map(x => x[key]);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < minSpan) { const c = (mx + mn) / 2; mn = c - minSpan / 2; mx = c + minSpan / 2; }
  return vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(1)},${(26 - (v - mn) / (mx - mn) * 24).toFixed(1)}`).join(' ');
}
function phoneLive() {
  const root = $('#pscreen'); const vals = liveValues();
  applyLive(root, vals);
  const spans = { temp: 4, pod: 40, power: 40 };
  $$('[data-spark]', root).forEach(svg => { const k = svg.getAttribute('data-spark'); const pl = svg.firstChild; pl.setAttribute('points', sparkPoints(k, 60, spans[k])); });
  const ring = $('[data-ring]', root);
  if (ring) { const C = 2 * Math.PI * 36; ring.setAttribute('stroke-dashoffset', (C * (1 - S.u.batteryPct / 100)).toFixed(1)); }
  const u = S.u;
  $$('[data-tone]', root).forEach(t => {
    const k = t.getAttribute('data-tone'); let tone = '';
    if (k === 'temp') tone = u.batteryTempC > 55 ? 'red' : u.batteryTempC > 40 ? 'amber' : '';
    if (k === 'voc') tone = u.podVoc > CONFIG.vocAlert ? 'red' : u.podVoc > CONFIG.vocRise ? 'amber' : '';
    if (k === 'power') tone = u.powerW > CONFIG.currentFactor * expectedPower(u.batteryPct) ? 'red' : '';
    t.classList.toggle('tone-amber', tone === 'amber'); t.classList.toggle('tone-red', tone === 'red');
  });
}

/* ---------- Drag-to-scroll (mouse) inside phone ---------- */
function initDragScroll() {
  const v = $('#pview'); let d = null; let suppress = false;
  v.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('input')) return;
    d = { y: e.clientY, st: v.scrollTop, moved: false };
  });
  window.addEventListener('pointermove', e => {
    if (!d) return; const scale = currentScale(); const dy = (e.clientY - d.y) / scale;
    if (!d.moved && Math.abs(dy) > 6) { d.moved = true; v.classList.add('dragging'); }
    if (d.moved) v.scrollTop = d.st - dy;
  });
  window.addEventListener('pointerup', () => { if (d && d.moved) { suppress = true; setTimeout(() => { suppress = false; }, 0); } d = null; v.classList.remove('dragging'); });
  v.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; } }, true);
}

  const pl = 34, pr = 10, pt = 8, pb = 8; const iw = W - pl - pr, ih = H - pt - pb;

  c.font = '600 11px ' + getComputedStyle(document.body).fontFamily; c.textBaseline = 'middle';
  c.fillStyle = '#5B6670'; c.strokeStyle = '#EEF1F4'; c.lineWidth = 1;
  o.ticks.forEach(t => { c.beginPath(); c.moveTo(pl, y(t)); c.lineTo(W - pr, y(t)); c.stroke(); c.fillText(String(t), 4, y(t)); });
  [[o.warn, '#C77C00', 'Warn'], [o.cut, '#E5484D', 'Cut']].forEach(([v, col, lab]) => {
    c.save(); c.setLineDash([5, 4]); c.strokeStyle = col; c.lineWidth = 1.5; c.beginPath(); c.moveTo(pl, y(v)); c.lineTo(W - pr, y(v)); c.stroke(); c.restore();
    c.fillStyle = col; c.font = '700 11px ' + getComputedStyle(document.body).fontFamily; c.fillText(`${lab} ${v}`, W - pr - 52, y(v) - 8);
  });
  const h = S.hist; const n = h.length;
  c.beginPath(); h.forEach((p, i) => { const xx = pl + i / (CONFIG.histLen - 1) * iw; const yy = y(p[key]); i ? c.lineTo(xx, yy) : c.moveTo(xx, yy); });
  c.strokeStyle = o.color; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
  if (o.key2) { c.beginPath(); h.forEach((p, i) => { const xx = pl + i / (CONFIG.histLen - 1) * iw; const yy = y(p[o.key2]); i ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }); c.strokeStyle = '#AEB7C0'; c.lineWidth = 1.5; c.setLineDash([2, 3]); c.stroke(); c.setLineDash([]); c.fillStyle = '#5B6670'; c.fillText('room air', pl + 6, y(h[n - 1][o.key2]) - 8); }
  const last = h[n - 1]; c.beginPath(); c.arc(pl + iw, y(last[key]), 4, 0, Math.PI * 2); c.fillStyle = o.color; c.fill();
}
function drawCharts() {
  drawChart($('#chTemp'), 'temp', { min: 15, max: 65, ticks: [20, 40, 60], warn: CONFIG.heatWarnC, cut: CONFIG.criticalC, color: '#C77C00' });
  drawChart($('#chVoc'), 'pod', { min: 0, max: 420, ticks: [0, 200, 400], warn: CONFIG.vocRise, cut: CONFIG.vocAlert, color: '#7C3AED', key2: 'room' });
}

/* =====================================================================
   PRESENTER PANEL
   ===================================================================== */
const PP_BTNS = [['1', 'Start charge', 'k1'], ['2', 'Heat trend', 'k2'], ['3', 'Cooking vapour', 'k3'], ['4', 'Off-gas event', 'k4', 'hot'], ['5', 'Charger fault', 'k5'], ['6', 'Timer stop', 'k6'], ['0', 'Acknowledge', 'k0'], ['R', 'Reset demo', 'kR']];
function renderPresenterStatic() {
  $('#presenter').innerHTML = `
    <div class="pp-h"><b>Presenter controls</b><button class="iconbtn pp-x" data-act="panel" aria-label="Close presenter controls">${icon('x', 18)}</button></div>
    <div class="pp-row"><span>State</span><span class="pp-state" id="ppState"></span></div>
    <div class="pp-read" style="margin-top:8px">
      <div><div class="l">Batt °C</div><div class="v num" data-live="temp"></div></div><div><div class="l">Pod VOC</div><div class="v num" data-live="voc"></div></div><div><div class="l">Room VOC</div><div class="v num" data-live="room"></div></div>
      <div><div class="l">Power W</div><div class="v num" data-live="power"></div></div><div><div class="l">Relay</div><div class="v num" data-live="relay"></div></div><div><div class="l">Battery %</div><div class="v num" data-live="pct"></div></div>
    </div>

      <div class="pp-next" id="ppNext"></div>

    <div class="pp-sec"><div class="pp-t">Scenarios</div><div class="pp-grid">${PP_BTNS.map(([k, l, a, c]) => `<button class="pp-btn ${c || ''}" data-act="${a}"><kbd>${k}</kbd>${l}</button>`).join('')}</div></div>
    <div class="pp-sec"><div class="pp-t">Simulation speed</div><div class="pp-row"><button class="pp-btn" data-act="kMinus" aria-label="Slower">${icon('minus', 16)}<kbd>−</kbd></button><span class="pp-state num" id="ppSpeed"></span><button class="pp-btn" data-act="kPlus" aria-label="Faster"><kbd>+</kbd>${icon('plus', 16)}</button></div></div>
    <div class="pp-sec"><div class="pp-t">Display</div><div class="pp-grid">
      <button class="pp-btn" data-act="kM" id="ppSound"></button>
      <button class="pp-btn" data-act="kC" id="ppCap"></button>
      <button class="pp-btn wide" data-act="kF">${icon('full', 16)} Fullscreen <kbd>F</kbd></button></div></div>
    <div class="pp-sec" style="color:#AEB7C0;line-height:1.5">Keys: <kbd>P</kbd> panel · <kbd>Space</kbd> script · <kbd>1</kbd>–<kbd>6</kbd> scenarios · <kbd>0</kbd> resolve · <kbd>R</kbd> reset · <kbd>+</kbd>/<kbd>−</kbd> speed · <kbd>M</kbd> sound · <kbd>C</kbd> captions · <kbd>F</kbd> fullscreen</div>`;
  renderPresenter();
}
function renderPresenter() {
  if (!S || !$('#ppState')) return;
  setText($('#ppState'), STRINGS.states[S.u.systemState].title);
  setText($('#ppSpeed'), speed() + '×');
  const sc = S.script;
  setText($('#ppScript'), sc.running ? (sc.paused ? 'Paused' : 'Running') : sc.finished ? 'Finished' : 'Ready');
  const t = Math.floor(sc.t / 4); setText($('#ppScriptT'), sc.running || sc.finished ? `${Math.floor(t / 60)}:${pad2(t % 60)} / 1:30` : '');
  const next = SCRIPT.slice(sc.running ? sc.idx : 0).find(s => s.label && !s.hidden);
  setText($('#ppNext'), next ? `Next · ${Math.floor(next.at / 60)}:${pad2(next.at % 60)} · ${next.label}` : 'Script complete');
  const play = $('#ppPlay'); const ph = `${icon(sc.running && !sc.paused ? 'pause' : 'play', 16)} ${sc.running ? (sc.paused ? 'Resume' : 'Pause') : 'Play script'} <kbd>Space</kbd>`; if (play.dataset.h !== ph) { play.dataset.h = ph; play.innerHTML = ph; }
  const sh = `${icon(UI.soundOn ? 'sound' : 'mute', 16)} Sound ${UI.soundOn ? 'on' : 'off'} <kbd>M</kbd>`; const sEl = $('#ppSound'); if (sEl.dataset.h !== sh) { sEl.dataset.h = sh; sEl.innerHTML = sh; }
  const ch = `${icon('cc', 16)} Captions ${UI.captionsOn ? 'on' : 'off'} <kbd>C</kbd>`; const cEl = $('#ppCap'); if (cEl.dataset.h !== ch) { cEl.dataset.h = ch; cEl.innerHTML = ch; }
}
function togglePanel(force) { UI.panelOpen = force != null ? force : !UI.panelOpen; $('#presenter').classList.toggle('open', UI.panelOpen); $('#gearBtn').setAttribute('aria-label', UI.panelOpen ? 'Close presenter controls (P)' : 'Open presenter controls (P)'); }
function setSpeed(idx) { S.speedIdx = (idx + CONFIG.speeds.length) % CONFIG.speeds.length; setText($('#tbSpeed'), speed() + '× speed'); renderPresenter(); }
function showCaption(text) {
  if (!UI.captionsOn || !text) return;
  const el = $('#caption'); el.textContent = text; el.classList.add('show');
  clearLater(UI.captionT); UI.captionT = later(() => el.classList.remove('show'), CONFIG.captionMs);
}
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
    else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { logError(e); }
}

/* =====================================================================
   SCENARIOS (scripted pitch, deterministic, tick-driven)
   ===================================================================== */
const SCRIPT = [
  { at: 0, label: 'Idle at home screen', caption: 'Maya plugs in her e-bike for the night.' },
  { at: 5, label: 'Start charge', caption: 'ChargeSentry watches every second of the charge.', fn: () => startCharge() },
  { at: 20, label: 'Cooking vapour (pod + room air)', caption: "Dinner's cooking. Both sensors see it.", fn: () => startScenario('cooking', { rise: 8, hold: 10 }) },
  { at: 28, label: 'Ambient filter, no cut', caption: 'No false alarm. Charging continues.' },
  { at: 40, label: 'Values back to normal' },
  { at: 48, label: 'Off-gas at the battery only', caption: 'A cell starts to fail. Only the pod sees it.', fn: () => startScenario('offgas', { ramp: 16 }) },
  { at: 60, label: 'Automatic power cut', caption: 'Power cut automatically, before any smoke.' },
  { at: 61.5, hidden: true, fn: () => { if (!S.u.alert && !S.u.acknowledged) triggerAlert('offgas'); } },
  { at: 70, label: 'Manager opens unit 304', caption: 'The building manager knows at the same moment.', fn: () => openDrawer(304) },
  { at: 80, label: "Tenant taps \"I'm safe\"", caption: "Everyone's informed. The incident is logged.", fn: () => simTapSafe() },
  { at: 90, label: 'End', fn: () => endScript() }
];
function startScript() {
  resetDemo();
  S.script = { running: true, paused: false, t: 0, idx: 0, finished: false };
  setSpeed(0);
  renderPresenter();
}
function scriptTick() {
  const sc = S.script; if (!sc.running || sc.paused) return;
  while (sc.idx < SCRIPT.length && SCRIPT[sc.idx].at * 4 <= sc.t) {
    const s = SCRIPT[sc.idx++];
    try { if (s.fn) s.fn(); } catch (e) { logError(e); }
    if (s.caption) showCaption(s.caption);
  }
  sc.t++;
  renderPresenter();
}
function toggleScript() {
  const sc = S.script;
  if (!sc.running) { startScript(); return; }
  sc.paused = !sc.paused; S.paused = sc.paused; renderPresenter();
}
function endScript() { S.script.running = false; S.script.finished = true; S.paused = false; renderPresenter(); }
function simTapSafe() {
  if (!S.u.alert) return;
  if (UI.overlay !== 'alert') openAlertOverlay();
  UI.sheet = null; renderOverlay();
  const b = $('#btnSafe'); if (b) { b.classList.add('sim-tap'); }
  later(() => tenantSafe(), 380);
}
function tenantSafe() {
  if (!acknowledge('tenant')) return;
  UI.overlay = 'alert'; renderOverlay(); renderPhone();
}

/* ---------- Bus subscribers (keep every view in sync) ---------- */
function initSubscribers() {
  Bus.on('state', () => {
    renderPhone(); renderGrid(); renderKpis(); renderSpot(); if (UI.drawer != null) renderDrawer(); renderPresenter(); updateLogoDot();
  });
  Bus.on('event', e => {
    // ticker
    if (e.type !== 'export') renderTickerItem(e);
    // manager feed
    if (!['charge_stop', 'test_done', 'pair'].includes(e.type)) addFeed({ time: e.time, unit: e.unit, severity: e.severity, message: e.message });
    // tenant alerts list
    if (['alert', 'warning', 'ambient', 'timer'].includes(e.type)) {
      const a = { id: 'e' + e.id, time: e.time, type: e.type, sev: e.type === 'alert' ? 'alert' : e.type === 'timer' ? 'timer' : e.type, title: e.type === 'alert' ? STRINGS.alerts[e.kind].hero : e.title, detail: e.type === 'alert' ? STRINGS.alerts[e.kind].notif : e.type === 'ambient' ? 'Room air also elevated, likely cooking. Charging continued.' : e.type === 'warning' ? `Battery reached ${e.readings.temp} °C. Power stayed on.` : `Stopped at your ${S.u.timerLimitH} h limit.`, read: false, resolved: e.type !== 'alert', live: true, readings: e.readings, alertObj: e.type === 'alert' ? S.u.alert : null };
      S.tenantAlerts.unshift(a);
    }
    if (e.type === 'alert') {
      const A = STRINGS.alerts[e.kind];
      shakePhone(); Sound.play('alert');
      UI.sheet = null; UI.overlay = 'alert';
      showNotif({ title: A.title, body: A.notif, sev: 'alert', target: { overlay: 'alert' } });
      showBanner('red', A.banner);
      renderPhone(); renderKpis();
      if (UI.drawer === 304) renderDrawer();
    } else if (e.type === 'ack') {
      showBanner('green', e.by === 'tenant' ? 'Unit 304: Tenant confirmed safe' : 'Unit 304: Alert acknowledged by manager');
      if (e.by === 'manager') { showNotif({ title: 'Building manager acknowledged', body: 'Gestion Laurier Inc. saw the alert and is following up.', sev: 'ok', target: { overlay: 'alert' } }); Sound.play('info'); }
      renderPhone(); if (UI.drawer === 304) renderDrawer();
    } else if (e.notify && S.settings.push) {
      const sevMap = { warning: 'warning', ambient: 'ambient', timer: 'timer', complete: 'ok' };
      const bodies = { warning: `Battery at ${e.readings.temp} °C. Power is still on. ChargeSentry is watching closely.`, ambient: 'Room vapour detected, likely cooking. Monitoring.', timer: `Your ${S.u.timerLimitH} h charge timer was reached. Power is off.`, complete: 'Battery is full. Power is off.' };
      const last = S.tenantAlerts[0];
      showNotif({ title: e.title, body: bodies[e.type] || e.message, sev: sevMap[e.type] || 'info', target: last && last.id === 'e' + e.id ? { alert: last.id } : { tab: 'home' } });
      Sound.play(e.type === 'warning' ? 'warning' : 'info');
      renderPhone(); renderKpis();
    } else if (e.notify) { renderPhone(); renderKpis(); }
    if (UI.drawer === e.unit && e.type !== 'alert' && e.type !== 'ack') renderDrawer();
  });
}
function renderTickerItem(e) {
  const el = $('#tkItems');
  const ic = { alert: 'shieldX', warning: 'thermo', ambient: 'vapor', timer: 'timer', ok: 'check', info: 'info' }[e.severity] || 'info';
  const d = document.createElement('div'); d.className = 'tk-item';
  d.innerHTML = `<span class="sev-dot sv-${e.severity}">${icon(ic, 11)}</span><span class="tk-time num">${fmtHMS(e.time)}</span><span>${esc(e.message)}</span>`;
  el.prepend(d); while (el.children.length > 3) el.lastChild.remove();
}
function updateLogoDot() { const d = $('#logoDot'); if (d) d.setAttribute('fill', STATE_HEX[S.u.systemState]); const sd = $('#simDot'); if (sd) sd.style.background = STATE_HEX[S.u.systemState]; }

/* ---------- Render loop for live values ---------- */
function renderLive() {
  try {
    const v = liveValues();
    applyLive($('#topbar'), v);
    phoneLive();
    applyLive($('#spot'), v);
    if (UI.drawer === 304) applyLive($('#drawer'), v);
    applyLive($('#presenter'), v);
    applyLive($('#diagCard'), v);
    diagUpdate(); drawCharts(); renderPresenter();
  } catch (e) { logError(e); }
}

/* ---------- Reset ---------- */
function resetDemo() {
  const t0 = performance.now();
  clearAllLater(); clearPairTimers();
  S = initialState();
  Object.assign(UI, { tab: 'home', stack: [], overlay: null, sheet: null, drawer: null, banner: null, histWeek: 0, lastScreenKey: '', pair: null, notifTarget: null });
  hideNotif(); hideBanner(); closeDrawer(); hideMgrModal();
  $('#caption').classList.remove('show'); $('#phoneHolder').classList.remove('shake');
  $('#tkItems').innerHTML = ''; $('#kpis').innerHTML = '';
  setSpeed(CONFIG.defaultSpeedIdx);
  renderGrid(); renderKpis(); renderSpot(); renderFeed(); renderPhone(false); updateLogoDot(); renderLive();
  window.__lastResetMs = performance.now() - t0;
}

/* ---------- Input: clicks ---------- */
const ACTIONS = {
  tab: a => setTab(a), nav: a => nav(a), back: () => back(), device: a => nav('device', a),
  startCharge: () => startCharge(), stopCharge: () => stopCharge(), testCut: () => testCut(),
  openAlert: () => openAlertOverlay(), closeAlert: () => { closeAlertOverlay(); renderPhone(); },
  imSafe: () => tenantSafe(),
  call: a => { UI.sheet = a === '911' ? 'call911' : 'callmgr'; renderOverlay(); },
  sheet: a => { UI.sheet = a; renderOverlay(); }, closeSheet: () => { UI.sheet = null; renderOverlay(); },
  histWeek: a => { UI.histWeek = +a; renderPhone(); },
  alertItem: a => { const it = S.tenantAlerts.find(x => x.id === a); if (!it) return; it.read = true; if (it.sev === 'alert' && S.u.alert && !it.resolved) { openAlertOverlay(); renderTabbar(); renderPhone(); return; } nav('alertDetail', a); },
  toggle: a => { if (a === 'share') return; S.settings[a] = !S.settings[a]; renderPhone(); },
  pairDone: () => { UI.pair = null; back(); },
  unit: a => openDrawer(+a), closeDrawer: () => closeDrawer(), hideBanner: () => hideBanner(),
  mgrAck: () => { acknowledge('manager'); },
  callTenant: a => { const id = +a; showMgrModal(`<div class="avatar" style="width:64px;height:64px;margin:0 auto 10px;font-size:22px">${icon('phone', 28)}</div><div style="font-size:20px;font-weight:800">Calling ${id === 304 ? STRINGS.tenant.name : 'tenant of unit ' + id}…</div><div class="mgr-sub" style="margin:6px 0 14px">Simulated call. This demo never dials.</div><button class="mbtn primary" style="width:100%" data-act="hideModal">End call</button>`); },
  hideModal: () => hideMgrModal(),
  exportCsv: a => exportCsv(+a),
  panel: () => togglePanel(),
  k1: () => keyAction('1'), k2: () => keyAction('2'), k3: () => keyAction('3'), k4: () => keyAction('4'), k5: () => keyAction('5'), k6: () => keyAction('6'), k0: () => keyAction('0'), kR: () => keyAction('r'),
  kSpace: () => keyAction(' '), kPlus: () => keyAction('+'), kMinus: () => keyAction('-'), kM: () => keyAction('m'), kC: () => keyAction('c'), kF: () => keyAction('f')
};
function onClick(e) {
  try {
    const wasUnlocked = Sound.unlocked;
    Sound.unlock();
    if (e.target.closest('#soundHint')) { if (wasUnlocked) toggleSound(); renderSoundChip(); return; }
    if (e.target.closest('#splash')) { hideSplash(); return; }
    if (e.target.closest('#pnotif')) { const t = UI.notifTarget; hideNotif(); if (t) { if (t.overlay) openAlertOverlay(); else if (t.alert) { const it = S.tenantAlerts.find(x => x.id === t.alert); if (it) it.read = true; UI.tab = 'alerts'; UI.stack = [{ name: 'alertDetail', arg: t.alert }]; renderPhone(false); } else setTab(t.tab || 'home'); } return; }
    if (e.target.closest('#gearBtn')) { togglePanel(); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    if (el.tagName === 'INPUT') return;
    if (el.disabled) return;
    const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg);
    if (el.closest('#presenter') && el.blur) el.blur();
    renderLive();
  } catch (err) { logError(err); }
}
function onInput(e) {
  try {
    const el = e.target; if (el.dataset.act !== 'timerRange') return;
    S.u.timerLimitH = +el.value; setText($('#timerVal'), el.value + ' h'); renderLive();
  } catch (err) { logError(err); }
}

/* ---------- Input: keyboard ---------- */
function keyAction(k) {
  switch (k) {
    case '1': startCharge(); break;
    case '2': startScenario('heat'); break;
    case '3': startScenario('cooking'); break;
    case '4': startScenario('offgas'); break;
    case '5': startScenario('fault'); break;
    case '6': startScenario('timer'); break;
    case '0': resolveActive(); break;
    case 'r': resetDemo(); break;
    case '+': setSpeed(S.speedIdx + 1); break;
    case '-': setSpeed(S.speedIdx - 1); break;
    case ' ': toggleScript(); break;
    case 'm': toggleSound(); break;
    case 'c': UI.captionsOn = !UI.captionsOn; if (!UI.captionsOn) $('#caption').classList.remove('show'); renderPresenter(); break;
    case 'f': toggleFullscreen(); break;
    case 'p': togglePanel(); break;
  }
  renderLive();
}
function onKey(e) {
  try {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.unlock();
    let k = e.key; if (k === 'Escape') { if (UI.panelOpen) togglePanel(false); return; }
    k = k.length === 1 ? k.toLowerCase() : k;
    if (k === '=') k = '+'; if (k === '_') k = '-';
    if (k === 'Spacebar') k = ' ';
    if (!['1', '2', '3', '4', '5', '6', '0', 'r', '+', '-', ' ', 'm', 'c', 'f', 'p'].includes(k)) return;
    if (k === ' ' || e.target.tagName === 'INPUT') e.preventDefault();
    if (e.repeat) return;
    if (!UI.splashDone) hideSplash();
    keyAction(k);
  } catch (err) { logError(err); }
}

/* ---------- Layout scaling ---------- */
let SCALE = 1;
function currentScale() { return SCALE; }
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  SCALE = Math.min(w / 1920, h / 1080);
  const x = (w - 1920 * SCALE) / 2, y = (h - 1080 * SCALE) / 2;
  $('#stage').style.transform = `translate(${x}px,${y}px) scale(${SCALE})`;
}
function hideSplash() { if (UI.splashDone) return; UI.splashDone = true; const s = $('#splash'); s.classList.add('hide'); setTimeout(() => { s.style.display = 'none'; }, 450); }

/* ---------- Boot ---------- */
function boot() {
  window.addEventListener('error', e => { logError(e.error || e.message); e.preventDefault && e.preventDefault(); });
  window.addEventListener('unhandledrejection', e => { logError(e.reason); e.preventDefault(); });
  $('#logo').innerHTML = logoSvg(34, 'logoDot') + '<span>ChargeSentry</span>';
  $('#gearBtn').innerHTML = icon('gear', 18);
  $('#phoneLabel').innerHTML = icon('phone', 15) + STRINGS.cols.phone;
  $('#protoBadge').textContent = STRINGS.badge;
  $('#sbIcons').innerHTML = statusIcons();
  $('#splash').innerHTML = logoSvg(96) + '<div class="wm">ChargeSentry</div><div class="p-sub">Safer charging, every night</div>';
  $('#tbDate').textContent = new Date().toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
  renderMgrStatic(); renderDiagramStatic(); renderPresenterStatic();
  initSubscribers(); initDragScroll();
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
  $('#ugrid').addEventListener('mouseover', e => { const t = e.target.closest('.utile'); if (t) unitTip(t); });
  $('#ugrid').addEventListener('mouseleave', () => $('#utip').classList.remove('show'));
  window.addEventListener('resize', fit);
  fit();
  resetDemo();
  renderSoundChip();
  setTimeout(hideSplash, 1500);
  setInterval(tick, CONFIG.tickMs);
}
boot();
</script>
